<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <title>3×3 Westfield Glòries</title>
  <!--
    GitHub Pages SPA redirect trick (rafgraph/spa-github-pages).
    GitHub Pages retorna 404 per qualsevol URL que no sigui un fitxer real.
    Aquest script redirigeix al root amb la ruta codificada com a query string,
    on index.html la llegeix i fa history.replaceState per restaurar-la.

    Cobreix: /checkin?id=... · /inscripcion · /equip · /blog/slug · etc.
  -->
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p style="font-family:sans-serif;color:#666;text-align:center;margin-top:40px">Redirigint…</p>
</body>
</html>
