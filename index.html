    <!-- Core Web Vitals → GA4 (LCP, INP, CLS, FCP, TTFB) -->
    <script>
      (function(){
        if (typeof gtag !== 'function') return;
        function send(metric){
          gtag('event', metric.name, {
            event_category: 'Web Vitals',
            event_label: metric.id,
            value: Math.round(metric.name === 'CLS' ? metric.value * 1000 : metric.value),
            non_interaction: true,
            metric_value: metric.value,
            metric_delta: metric.delta,
            metric_rating: metric.rating || 'unknown',
          });
        }
        // Carrega web-vitals només si el navegador suporta PerformanceObserver
        if ('PerformanceObserver' in window) {
          import('https://unpkg.com/web-vitals@4?module').then(function(wv){
            wv.onLCP(send); wv.onINP(send); wv.onCLS(send); wv.onFCP(send); wv.onTTFB(send);
          }).catch(function(){});
        }
      })();
    </script>
